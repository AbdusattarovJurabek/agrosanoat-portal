services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrosanoat-portal
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD .env faylida berilishi shart}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - agro_portal_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  agro_portal_data:
    name: agrosanoat-portal-data
